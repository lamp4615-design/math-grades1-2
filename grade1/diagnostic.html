<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數學勇士大挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2140; --ink-soft:#5b527a; --bg:#fbf6e9; --bg2:#eef5e6;
    --card:#ffffff; --card-border:#e7ded0; --accent:#ff6b4a; --accent-ink:#ffffff;
    --accent2:#2f9e8f; --gold:#f2a516; --wrong:#e5484d; --right:#2f9e5f; --warn:#c98a00;
    --face:#fffdf7; --hour:#2b2140; --minute:#ff6b4a; --tick:#8a809f;
    --bead:#ff6b4a; --stick:#d9a441; --band:#2f9e8f; --egg:#fff3dc; --egg-line:#c9a978; --carton:#e9d8bd;
    --cube:#9fc6f0; --cube-top:#c9e0f7; --cube-side:#6f9fd1; --cube-line:#2b2140;
    --rib0:#ff8a68; --rib1:#4bb3a3; --rib2:#f2a516; --unit:#fffdf7;
    --shadow: 0 6px 0 rgba(43,33,64,0.08), 0 10px 24px rgba(43,33,64,0.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#f1ece0; --ink-soft:#c9c2df; --bg:#1b2420; --bg2:#212c26;
      --card:#26332c; --card-border:#3a4a40; --accent:#ff8a68; --accent-ink:#26170f;
      --accent2:#4bc2b0; --gold:#ffc45e; --wrong:#ff6b6f; --right:#57d17f; --warn:#ffc45e;
      --face:#1f2a24; --hour:#f1ece0; --minute:#ff8a68; --tick:#9a94b0;
      --bead:#ff8a68; --stick:#e0b45a; --band:#4bc2b0; --egg:#3b3426; --egg-line:#b89a6a; --carton:#4a3f2e;
      --cube:#3f6a96; --cube-top:#5683b0; --cube-side:#2c4f73; --cube-line:#f1ece0;
      --rib0:#ff8a68; --rib1:#4bc2b0; --rib2:#ffc45e; --unit:#1f2a24;
      --shadow: 0 6px 0 rgba(0,0,0,0.25), 0 10px 24px rgba(0,0,0,0.35);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Baloo 2","PingFang TC","Microsoft JhengHei","Heiti TC",-apple-system,sans-serif;
    padding:16px 16px 48px; line-height:1.8;
  }
  h1,h2,h3{ margin:0; text-wrap:balance; }
  p{ margin:0; }
  ruby{ ruby-position:inter-character; }
  rt{ font-size:0.62em; color:var(--ink-soft); font-weight:700; user-select:none; margin-inline-start:1px; }
  body.zy-off rt{ display:none; }
  .btn{
    font-family:inherit; font-weight:700; font-size:17px; border-radius:14px;
    padding:10px 18px; cursor:pointer; background:var(--card); color:var(--ink);
    border:2px solid var(--card-border); box-shadow:var(--shadow); transition:transform .08s ease;
    text-decoration:none; display:inline-block;
  }
  .btn:active{ transform:translateY(3px); box-shadow:none; }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .btn.small{ font-size:15px; padding:6px 12px; }
  .btn:focus-visible, .choice:focus-visible, .key:focus-visible{ outline:3px solid var(--accent2); outline-offset:2px; }
  .btn[disabled]{ opacity:.45; cursor:default; }
  #app{ max-width:880px; margin:0 auto; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .topbar .who{ font-size:15px; color:var(--ink-soft); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .topbar .tools{ display:flex; gap:6px; flex-wrap:wrap; }
  .card{ background:var(--card); border:2px solid var(--card-border); border-radius:22px; padding:18px; box-shadow:var(--shadow); margin-bottom:16px; }
  .hero{ background:linear-gradient(135deg,var(--bg2),var(--bg)); border:2px solid var(--card-border);
    border-radius:22px; padding:20px; margin-bottom:18px; display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .hero h1{ font-size:clamp(26px,5vw,36px); font-weight:800; }
  .hero .sub{ color:var(--ink-soft); font-size:16px; margin-top:6px; line-height:2.1; }
  .hero .mascot{ font-size:64px; letter-spacing:4px; }
  .modes{ display:grid; grid-template-columns:1fr; gap:14px; }
  @media (min-width:560px){ .modes{ grid-template-columns:1fr 1fr; } }
  .mode{ text-align:left; display:flex; gap:14px; align-items:flex-start; background:var(--card);
    border:2px solid var(--card-border); border-radius:20px; padding:18px; cursor:pointer; color:var(--ink);
    box-shadow:var(--shadow); font-family:inherit; font-size:16px; width:100%; }
  .mode:active{ transform:translateY(3px); box-shadow:none; }
  .mode .ic{ font-size:42px; line-height:1; }
  .mode .t{ font-size:21px; font-weight:800; display:block; }
  .mode .d{ font-size:15px; color:var(--ink-soft); display:block; line-height:2.1; }
  .tip{ margin-top:18px; background:var(--card); border:2px dashed var(--card-border); border-radius:16px; padding:14px 16px; font-size:15px; color:var(--ink-soft); line-height:2.1; }
  label.f{ display:block; font-weight:800; margin:12px 0 4px; font-size:17px; }
  input.f, select.f{ width:100%; font-family:inherit; font-size:20px; padding:10px 12px; border-radius:12px;
    border:2px solid var(--card-border); background:var(--face); color:var(--ink); }
  .warn{ color:var(--wrong); font-weight:800; margin-top:8px; min-height:1.6em; }
  .row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .center{ text-align:center; }
  .muted{ color:var(--ink-soft); }

  /* ---- play ---- */
  .bosshead{ display:flex; align-items:center; gap:12px; }
  .boss{ font-size:56px; line-height:1; transition:transform .2s; }
  .boss.hit{ animation:hit .45s ease; }
  .boss.laugh{ animation:laugh .5s ease; }
  @keyframes hit{ 0%{transform:translateX(0)} 25%{transform:translateX(-10px) rotate(-8deg)} 50%{transform:translateX(10px) rotate(8deg)} 100%{transform:translateX(0)} }
  @keyframes laugh{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  .bossinfo{ flex:1; min-width:0; }
  .bossinfo b{ font-size:18px; }
  .hp{ height:16px; background:var(--bg2); border-radius:9px; border:2px solid var(--card-border); overflow:hidden; margin-top:4px; }
  .hp i{ display:block; height:100%; background:var(--wrong); transition:width .4s ease; }
  .scorebox{ text-align:right; font-weight:800; font-size:17px; white-space:nowrap; }
  .prog{ height:10px; background:var(--bg2); border-radius:6px; margin:12px 0 4px; overflow:hidden; }
  .prog i{ display:block; height:100%; background:var(--accent2); }
  .progtxt{ font-size:14px; color:var(--ink-soft); font-weight:700; display:flex; justify-content:space-between; }
  .stem{ font-size:clamp(20px,4.3vw,25px); font-weight:800; margin:12px 0 8px; line-height:2.3; }
  .stemrow{ display:flex; gap:10px; align-items:flex-start; }
  .stemrow .stem{ flex:1; }
  .vis{ display:flex; justify-content:center; margin:6px 0 10px; overflow-x:auto; }
  svg.pic{ max-width:100%; height:auto; }
  .choices{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; }
  .choice{ font-family:inherit; font-size:22px; font-weight:800; min-height:68px; padding:8px 10px; border-radius:16px; cursor:pointer;
    background:var(--card); color:var(--ink); border:3px solid var(--card-border); box-shadow:var(--shadow); line-height:2.1; }
  .choice:active{ transform:translateY(3px); box-shadow:none; }
  .choice.picked-ok{ background:var(--right); color:#fff; border-color:transparent; }
  .choice.picked-no{ background:var(--wrong); color:#fff; border-color:transparent; }
  .choice.picked-ok rt, .choice.picked-no rt{ color:#fff; }
  .choices.long .choice{ font-size:19px; }
  .choice .emo{ font-size:40px; }
  .numpad{ max-width:360px; margin:6px auto 0; }
  .numshow{ text-align:center; font-size:38px; font-weight:800; border:3px solid var(--card-border); border-radius:16px; background:var(--face); min-height:66px; margin-bottom:10px; }
  .numshow .u{ font-size:22px; color:var(--ink-soft); margin-left:6px; }
  .keys{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .key{ font-family:inherit; font-size:28px; font-weight:800; min-height:60px; border-radius:14px; cursor:pointer;
    background:var(--card); color:var(--ink); border:2px solid var(--card-border); box-shadow:var(--shadow); }
  .key:active{ transform:translateY(3px); box-shadow:none; }
  .key.ok{ background:var(--accent); color:var(--accent-ink); border-color:transparent; font-size:22px; }
  .fb{ text-align:center; font-size:21px; font-weight:800; min-height:2.2em; margin-top:10px; line-height:2.2; }
  .fb.ok{ color:var(--right); } .fb.no{ color:var(--wrong); }
  .dunno{ font-size:15px; }
  .groups{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; }
  .grp{ border:2px dashed var(--card-border); border-radius:12px; padding:2px 8px; font-size:26px; line-height:1.5; }
  .plus{ font-size:30px; font-weight:800; }
  .emo{ font-size:32px; line-height:1.3; }
  .rowline{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center; }
  .rowline .lr{ font-weight:800; color:var(--ink-soft); font-size:18px; padding:0 6px; }
  .pair{ display:flex; gap:18px; flex-wrap:wrap; justify-content:center; }
  .pair > div{ text-align:center; border:2px solid var(--card-border); border-radius:14px; padding:6px 10px; }
  .pair b{ display:block; font-size:20px; }
  .teams{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .tchip{ flex:1; min-width:110px; border-radius:12px; padding:4px 10px; color:#fff; font-weight:800; font-size:15px; display:flex; justify-content:space-between; gap:6px; }
  .tchip.me{ outline:3px solid var(--ink); outline-offset:1px; }

  /* svg parts */
  .str{ fill:none; stroke:var(--ink-soft); stroke-width:2; }
  .bead{ fill:var(--bead); }
  .stick{ fill:var(--stick); }
  .band{ fill:var(--band); }
  .bandt{ text-anchor:middle; font-size:11px; font-weight:800; fill:#fff; font-family:sans-serif; }
  .carton{ fill:var(--carton); stroke:var(--egg-line); stroke-width:1.5; }
  .egg{ fill:var(--egg); stroke:var(--egg-line); stroke-width:1.5; }
  .coin{ stroke-width:2.5; }
  .c1,.c5,.c10{ fill:#d9dde3; stroke:#8b93a1; }
  .c5{ fill:#e6e1d3; } .c10{ fill:#e8c98a; stroke:#a8843a; }
  .c50{ fill:#f2d16b; stroke:#b08f22; }
  .coint{ text-anchor:middle; font-weight:800; fill:#3a2f10; font-family:sans-serif; }
  .face{ fill:var(--face); stroke:var(--ink); stroke-width:4; }
  .tk{ stroke:var(--tick); stroke-width:1.5; } .tk5{ stroke:var(--ink); stroke-width:3; }
  .cn{ text-anchor:middle; font-size:20px; font-weight:800; fill:var(--ink); font-family:sans-serif; }
  .hh{ stroke:var(--hour); stroke-width:8; stroke-linecap:round; }
  .mh{ stroke:var(--minute); stroke-width:5; stroke-linecap:round; }
  .hub{ fill:var(--ink); }
  .calt{ text-anchor:middle; font-size:18px; font-weight:800; fill:var(--ink); }
  .calh{ fill:var(--bg2); stroke:var(--card-border); }
  .calc{ fill:var(--face); stroke:var(--card-border); }
  .calw,.cald{ text-anchor:middle; font-size:15px; font-weight:800; fill:var(--ink); font-family:sans-serif; }
  .we{ fill:var(--wrong); }
  .eraser{ fill:#f29bb2; } .pencil{ fill:#f2c94c; stroke:#b08f22; } .wood{ fill:#e8c9a0; } .lead{ fill:#444; }
  .guide{ stroke:var(--ink-soft); stroke-width:1.5; stroke-dasharray:4 4; }
  .unit{ fill:var(--unit); stroke:var(--ink); stroke-width:1.5; }
  .lbl{ font-size:18px; font-weight:800; fill:var(--ink); }
  .rib0,.rib{ fill:var(--rib0); } .rib1,.rib2b{ fill:var(--rib1); } .rib2{ fill:var(--rib2); }
  .clip{ fill:none; stroke:var(--ink-soft); stroke-width:1.6; }
  .route{ fill:none; stroke:var(--accent2); stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
  .emot{ font-size:26px; }
  .cf{ fill:var(--cube); stroke:var(--cube-line); stroke-width:1.5; }
  .ct{ fill:var(--cube-top); stroke:var(--cube-line); stroke-width:1.5; }
  .cs{ fill:var(--cube-side); stroke:var(--cube-line); stroke-width:1.5; }
  .shp{ fill:var(--cube-top); stroke:var(--ink); stroke-width:3; }
  .shl{ stroke:var(--ink); stroke-width:2.5; stroke-dasharray:6 4; }

  /* stage & result */
  .stage{ text-align:center; padding:26px 12px; }
  .stage .big{ font-size:80px; line-height:1.2; }
  .stage .stars{ font-size:46px; color:var(--gold); letter-spacing:6px; }
  .stage h2{ font-size:28px; margin-top:8px; }
  .stage p{ font-size:18px; color:var(--ink-soft); margin-top:6px; line-height:2.1; }

  /* report */
  .kid h2{ font-size:26px; }
  .kid .line{ font-size:18px; margin-top:8px; line-height:2.2; }
  .pill{ display:inline-block; padding:0 10px; border-radius:20px; background:var(--bg2); border:2px solid var(--card-border); margin:3px 4px 3px 0; font-size:16px; }
  .rep h3{ font-size:20px; margin:4px 0 8px; }
  .rep table{ width:100%; border-collapse:collapse; font-size:15px; line-height:1.6; }
  .rep th, .rep td{ border:1px solid var(--card-border); padding:6px 8px; text-align:left; vertical-align:top; }
  .rep th{ background:var(--bg2); }
  .rep td.st{ white-space:nowrap; font-weight:800; }
  .rep tbody td:first-child{ white-space:nowrap; }
  .s-pass{ color:var(--right); } .s-weak{ color:var(--warn); } .s-fail{ color:var(--wrong); }
  .hot{ font-size:12px; color:var(--wrong); font-weight:800; white-space:nowrap; }
  .tblwrap{ overflow-x:auto; }
  .wrongitem{ border-left:4px solid var(--wrong); padding:6px 10px; margin:8px 0; background:var(--bg2); border-radius:0 10px 10px 0; font-size:15px; line-height:1.8; }
  .wrongitem .err{ color:var(--wrong); font-weight:800; }
  .metaline{ font-size:15px; color:var(--ink-soft); }
  .mx td, .mx th{ text-align:center; padding:4px 5px; font-size:14px; }
  .mx td.nm{ text-align:left; white-space:nowrap; }
  .mx th.code{ writing-mode:vertical-rl; white-space:nowrap; font-size:13px; padding:6px 2px; }
  .linkbtn{ background:none; border:none; color:var(--accent2); font:inherit; font-weight:800; cursor:pointer; text-decoration:underline; padding:0; }
  .hist{ width:100%; border-collapse:collapse; }
  .hist td{ border-bottom:1px solid var(--card-border); padding:8px 6px; font-size:15px; }

  /* join / board */
  .codeshow{ font-size:54px; font-weight:800; letter-spacing:12px; text-align:center; border:3px solid var(--card-border); border-radius:16px; background:var(--face); min-height:84px; }
  .teampick{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  .teambtn{ font-family:inherit; font-size:24px; font-weight:800; color:#fff; border:4px solid transparent; border-radius:16px; min-height:64px; cursor:pointer; box-shadow:var(--shadow); }
  .teambtn.sel{ border-color:var(--ink); transform:scale(1.04); }
  .board .roomcode{ font-size:72px; font-weight:800; letter-spacing:14px; text-align:center; line-height:1.2; }
  .barrow{ display:flex; align-items:center; gap:10px; margin:12px 0; }
  .barrow .nm{ width:78px; font-weight:800; font-size:22px; }
  .barrow .bar{ flex:1; height:40px; background:var(--bg2); border-radius:12px; overflow:hidden; }
  .barrow .bar i{ display:block; height:100%; border-radius:12px; transition:width .6s ease; }
  .barrow .val{ width:150px; font-weight:800; font-size:18px; text-align:right; }
  .hidden{ display:none !important; }
  @media print{
    body{ background:#fff; color:#000; padding:0; }
    .topbar, .no-print{ display:none !important; }
    .card{ box-shadow:none; border-color:#999; break-inside:avoid; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <a class="btn small" href="index.html" id="lnk-home"></a>
    <span class="who" id="who"></span>
    <span class="tools">
      <button class="btn small" id="btn-tts" data-act="tts"></button>
      <button class="btn small" id="btn-zy" data-act="zy"></button>
      <button class="btn small" data-act="teacher" title="老師專區">⚙️</button>
    </span>
  </div>
  <section id="scr-login" class="hidden"></section>
  <section id="scr-hub" class="hidden"></section>
  <section id="scr-join" class="hidden"></section>
  <section id="scr-play" class="hidden"></section>
  <section id="scr-stage" class="hidden"></section>
  <section id="scr-report" class="hidden"></section>
  <section id="scr-history" class="hidden"></section>
  <section id="scr-teacher" class="hidden"></section>
  <section id="scr-board" class="hidden"></section>
</div>
<noscript>這個遊戲需要開啟 JavaScript。</noscript>

  var R=Math.random;

  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(R()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  /* 選擇題：correct 是正確選項；wrongs 是 [選項, 迷思說明]，依重要性排列，最多取 3 個；
   * fill 用來在選項不足 4 個時補上相近的數。 */
  function mc(correct, wrongs, fill){
    var list=[], seen={};
    function add(o){ if(seen[o.t]||list.length>=4) return; seen[o.t]=1; list.push(o); }
    add(copy(asOpt(correct),{ok:true}));
    wrongs.forEach(function(w){ add(copy(asOpt(w[0]),{err:w[1]})); });
    if(fill){ var d=1; while(list.length<4 && d<30){ var v=fill.base+(d%2?1:-1)*Math.ceil(d/2)*(fill.step||1); d++; if(v>=0) add({t:v+(fill.unit||''), err:fill.err||'計算或數數錯誤'}); } }

  var DEFAULT_API_URL='https://script.google.com/macros/s/AKfycbymeX7KkuiscvkkPhIMr085r96sa3varVo_zXe7G5FUreDMBv77vRn-1xNCq86Ksb8NHw/exec';
  function getApiUrl(){ var v=lsGet('nf_api',''); return (v&&v.trim())?v.trim():DEFAULT_API_URL; }
  function apiGet(params){
    var api=getApiUrl(); if(!api) return Promise.reject(new Error('no api'));
    var q=Object.keys(params).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
    return fetch(api+(api.indexOf('?')>-1?'&':'?')+q).then(function(r){ return r.json(); });
  }
  function apiPost(body){

  }
  // 後台是否已更新成支援診斷的版本（舊版會把資料誤寫進「作答紀錄」，所以要先確認）
  var backendState='unknown', backendPromise=null;
  function checkBackend(force){
    if(backendPromise && !force) return backendPromise;
    backendPromise=apiGet({action:'diagRoom', room:'0'}).then(function(d){
      backendState=(d && d.ok && Array.isArray(d.teams))?'ok':'old'; return backendState==='ok';
    }).catch(function(){ backendState='off'; backendPromise=null; return false; });
    return backendPromise;
  }
  function outbox(){ return lsJSON('dx_outbox',[]); }
  function sendResult(payload){
    return checkBackend().then(function(ok){
      if(!ok) throw new Error('backend');
      return apiPost(payload);
    }).then(function(res){
      if(!res || !res.ok) throw new Error('rejected');
      return true;
    }).catch(function(){
      var box=outbox(); if(!box.some(function(p){ return p.testId===payload.testId; })){ box.push(payload); lsSetJSON('dx_outbox',box.slice(-60)); }
      return false;
    });
  }
  function flushOutbox(){
    var box=outbox(); if(!box.length) return;
    checkBackend().then(function(ok){
      if(!ok) return;
      var left=box.slice();
      (function next(){
        if(!left.length){ lsSetJSON('dx_outbox',[]); return; }
        apiPost(left[0]).then(function(res){ if(res&&res.ok){ left.shift(); lsSetJSON('dx_outbox',left); next(); } }).catch(function(){});
      })();
    });
  }

      '<p class="warn" id="jwarn"></p><div class="row"><button class="btn" data-act="hub">'+az('返回')+'</button><button class="btn primary" data-act="jstart">'+az('開始比賽！')+'</button></div></div>';

  /* ---------- 測驗流程 ---------- */
  var T=null; // 目前的測驗
  function dayKey(){ var d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
  function newId(){ return Date.now().toString(36)+Math.floor(Math.random()*1e9).toString(36); }
  function startTest(mode, opt){
    opt=opt||{};
    var plan=PLAN_FULL, seed;
    if(mode==='retest'){ plan={}; opt.codes.forEach(function(c){ plan[c]=3; }); }
    if(mode==='team') seed=hashStr('room'+opt.room+'-'+dayKey()); // 同一房間、同一天，全隊題目相同
    else seed=(Date.now() ^ Math.floor(Math.random()*4294967295))>>>0;
    T={ id:newId(), mode:mode, room:opt.room||'', team:opt.team||'', items:buildTest(plan, seed), i:0, rec:[],
        score:0, combo:0, best:0, locked:false, num:'' };
    showQuestion();
  }
  function areaStats(areaId){
    var n=0, right=0, done=0;
    T.items.forEach(function(it,i){ if(it.area!==areaId) return; n++; if(i<T.rec.length){ done++; if(T.rec[i].ok) right++; } });
    return {n:n, right:right, done:done};
  }
  function teamStrip(){ return T.mode==='team' ? '<div class="teams" id="tstrip"><span class="muted">'+az('隊伍分數讀取中…')+'</span></div>' : ''; }
  function showQuestion(){
    var it=T.items[T.i], area=AREA_BY[it.area], st=areaStats(it.area), N=T.items.length;
    var hp=Math.round((st.n-st.right)/st.n*100);
    var h='<div class="card"><div class="bosshead"><div class="boss" id="boss" aria-hidden="true">'+area.boss+'</div>'+
      '<div class="bossinfo"><b>'+az(area.name)+'・'+az(area.bossName)+'</b><div class="hp" aria-label="魔王血量"><i style="width:'+hp+'%"></i></div></div>'+

      '<div class="stemrow"><p class="stem">'+az(it.stem)+'</p><button class="btn small" data-act="say" title="唸題目" aria-label="唸題目">🔊</button></div>'+

  function answerText(it){ if(it.choices){ for(var i=0;i<it.choices.length;i++) if(it.choices[i].ok) return it.choices[i].t; } return it.num+(it.unit||''); }
  function record(ok, given, err){
    var it=T.items[T.i];
    T.rec.push({ no:T.i+1, code:it.code, area:it.area, codeName:CODES[it.code].name, q:it.stem.replace(/\n/g,' '),
      given:String(given), ans:answerText(it), ok:ok, err:ok?'':err });

      right:right, total:T.rec.length, codes:codeStats(T.rec),
      wrong:T.rec.filter(function(r){ return !r.ok; }).map(function(r){ return {no:r.no, code:r.code, q:r.q, given:r.given, ans:r.ans, err:r.err}; }) };
    var hist=lsJSON('dx_history',[]); hist.unshift(res); lsSetJSON('dx_history',hist.slice(0,300));
    var payload={ type:'diagnostic', testId:res.id, className:id.cls, studentName:id.name, mode:modeLabel, room:T.room, team:T.team, score:T.score,

    if(T.mode==='team') sendProgress(true);

  /* ---------- 團體戰分數 ---------- */
  function teamChips(teams, me){

    function tick(){ if(!T) return; var room=T.room, me=T.team; apiGet({action:'diagRoom', room:room}).then(function(d){ var el=$('tstrip'); if(el && d && d.teams) el.innerHTML=teamChips(d.teams, me); }).catch(function(){}); }

        '<span class="val">'+az('平均')+' '+t.avg+'<br><small>'+t.finished+'/'+t.members+' '+az('人完成')+'</small></span></div>'; }).join('');
  }

  /* ---------- 診斷報告 ---------- */
  function statusOf(r,t){ if(r===t) return 'pass'; if(t>=2 && r*2>=t) return 'weak'; return 'fail'; }
  var ST_LABEL={pass:'✅ 通過', weak:'⚠️ 需加強', fail:'❌ 未通過'};
  function needCodes(res){ return CODE_ORDER.filter(function(c){ var v=res.codes[c]; return v && statusOf(v[0],v[1])!=='pass'; }); }
  function myHistory(){ var id=getIdentity(); if(!id) return []; return lsJSON('dx_history',[]).filter(function(r){ return r.cls===id.cls && r.name===id.name; }); }
  var lastReport=null;
  function renderReport(res, opt){
    opt=opt||{}; lastReport=res;
    var rows=CODE_ORDER.filter(function(c){ return res.codes[c]; }).map(function(c){ var v=res.codes[c]; return {code:c, r:v[0], t:v[1], st:statusOf(v[0],v[1])}; });
    var pass=rows.filter(function(x){ return x.st==='pass'; }), need=rows.filter(function(x){ return x.st!=='pass'; });
    var pct=res.total?Math.round(res.right*100/res.total):0;
    var h='';
    if(opt.mine){
      h+='<div class="card kid center"><div style="font-size:56px" aria-hidden="true">'+(pct>=80?'🏆':pct>=60?'🎉':'💪')+'</div>'+
        '<h2>'+az('你答對了')+' '+res.right+' / '+res.total+' '+az('題！')+'</h2><p class="line">⭐ '+res.score+(res.best>1?' ・ 🔥 '+az('最多連續答對')+' '+res.best+' '+az('題'):'')+'</p>'+
        (pass.length?'<p class="line">'+az('你已經學會：')+'<br>'+pass.map(function(x){ return '<span class="pill">'+az(KID_NAME[x.code])+'</span>'; }).join('')+'</p>':'')+
        (need.length?'<p class="line">'+az('要再多練習：')+'<br>'+need.map(function(x){ return '<span class="pill">'+az(KID_NAME[x.code])+'</span>'; }).join('')+'</p>':'<p class="line">'+az('全部通過，你是數學勇士！')+'</p>')+
        (opt.fresh?'<p class="metaline" id="send-status">⏳ 正在送出成績…</p>':'')+'</div>';
      if(res.mode==='團體戰' && opt.fresh) h+='<div class="card no-print"><h3>'+az('隊伍成績')+'</h3><div id="wait-board"><p class="muted">'+az('讀取中…')+'</p></div></div>';
    }
    /*T*/
    var level=pct>=80?'大致精熟':pct>=60?'部分精熟，請加強下方標示的項目':'建議優先安排補救教學';
    h+='<div class="card rep"><h3>📋 學習診斷報告（教師版）</h3>'+
      '<p class="metaline">'+esc(res.cls)+' '+esc(res.name)+'｜'+fmtTime(res.ts)+'｜'+esc(res.mode)+(res.room?'｜房間 '+esc(res.room)+' '+esc(res.team):'')+'</p>'+
      '<p style="margin:8px 0;font-size:17px"><b>答對 '+res.right+' / '+res.total+' 題（'+pct+'%）</b>：'+level+'</p>'+
      '<p class="metaline">判讀：每個指標全對為「通過」；2 題以上答對一半以上為「需加強」；其餘為「未通過」。百分比門檻為本遊戲自訂的參考，不是篩選測驗的通過標準。標 ★ 的是〈學扶題對照表〉中全國錯誤率較高的指標。</p>'+
      '<div class="tblwrap"><table><thead><tr><th>指標代碼</th><th>基本學習內容</th><th>答對</th><th>結果</th></tr></thead><tbody>'+
      rows.map(function(x){ return '<tr><td>'+x.code+(CODES[x.code].hot?' <span class="hot">★</span>':'')+'</td><td>'+esc(CODES[x.code].name)+'</td><td>'+x.r+'/'+x.t+'</td><td class="st s-'+x.st+'">'+ST_LABEL[x.st]+'</td></tr>'; }).join('')+
      '</tbody></table></div></div>';
    if(res.wrong.length){
      h+='<div class="card rep"><h3>❌ 錯題與可能的迷思（'+res.wrong.length+' 題）</h3>'+
        res.wrong.map(function(w){ return '<div class="wrongitem"><b>第 '+w.no+' 題｜'+esc(w.code)+'</b> '+esc(w.q)+'<br>孩子的答案：<b>'+esc(w.given)+'</b>　正確答案：<b>'+esc(w.ans)+'</b><br><span class="err">可能的迷思：'+esc(w.err||'—')+'</span></div>'; }).join('')+'</div>';
    }
    if(need.length){
      h+='<div class="card rep"><h3>🧭 教學建議</h3>'+need.map(function(x){ return '<p style="margin:8px 0"><b class="s-'+x.st+'">'+x.code+' '+esc(CODES[x.code].name)+'</b><br>'+esc(CODES[x.code].tip)+'</p>'; }).join('')+'</div>';
    }
    /*/T*/
    h+='<div class="row no-print"><button class="btn" data-act="print">🖨️ '+az('列印')+'</button>'+
      (opt.mine && need.length?'<button class="btn primary" data-act="retest">🔁 '+az('複測還不熟的本領')+'</button>':'')+
      '<button class="btn" data-act="'+(opt.back||'hub')+'">'+az('返回')+'</button></div>';
    show('report', h);
    if(opt.fresh && ttsPref()) say('你答對了'+res.right+'題');
  }

  /* ---------- 我的紀錄 ---------- */
  function renderMyHistory(){
    var list=myHistory();
    show('history','<div class="card"><h2>📋 '+az('我的紀錄')+'</h2>'+(list.length?'<table class="hist">'+list.map(function(r){
      return '<tr><td>'+fmtTime(r.ts)+'</td><td>'+az(r.mode)+'</td><td>'+r.right+'/'+r.total+'</td><td><button class="btn small" data-act="hist-open" data-id="'+esc(r.id)+'" data-back="myhist">'+az('看報告')+'</button></td></tr>'; }).join('')+'</table>'
      :'<p class="muted">'+az('還沒有紀錄，先去挑戰魔王吧！')+'</p>')+'<div class="row"><button class="btn" data-act="hub">'+az('返回')+'</button></div></div>');
  }

  /*T*/
  /* ---------- 老師專區 ---------- */
  var mxData=[];
  function renderTeacher(){
    var hist=lsJSON('dx_history',[]), box=outbox();
    var state={unknown:'檢查中…', ok:'✅ 已連線，後台支援診斷紀錄', old:'⚠️ 後台還是舊版：請把 grade1/Code.gs 貼到 Apps Script，執行 setupSheets，再「管理部署作業 → 新版本」重新部署', off:'❌ 連不上後台（沒有網路或網址錯誤）'};
    show('teacher','<div class="card"><h2>⚙️ 老師專區</h2>'+
      '<p class="metaline" id="be-state">後台狀態：'+state[backendState]+(box.length?'<br>這台平板還有 '+box.length+' 份成績等待補送。':'')+'</p>'+
      '<label class="f" for="api-in">Google Apps Script 網址（和數字森林共用）</label><input class="f" id="api-in" style="font-size:14px" value="'+esc(getApiUrl())+'">'+
      '<label class="f" for="key-in">老師金鑰（Code.gs 裡的 DX_TEACHER_KEY，用來讀回全班總表）</label><input class="f" id="key-in" type="password" style="font-size:16px" value="'+esc(lsGet('dx_key',''))+'">'+
      '<div class="row"><button class="btn primary" data-act="t-save">儲存設定</button></div></div>'+
      '<div class="card"><h2>🛡️ 團體戰</h2><p class="muted">按「開新房間」會產生一組 4 位數號碼。用投影機打開大螢幕，孩子在自己的平板選「團體戰」輸入號碼和隊伍。同一個房間、同一天，全部孩子拿到相同的題目。</p>'+
      '<div class="row"><button class="btn primary" data-act="t-newroom">開新房間</button><input class="f" id="room-in" inputmode="numeric" maxlength="4" placeholder="或輸入已開的房間號碼" style="max-width:240px;font-size:17px"><button class="btn" data-act="t-openroom">打開大螢幕</button></div></div>'+
      '<div class="card"><h2>📊 全班診斷總表</h2><p class="muted">每位孩子取最近一次的結果，列出每個指標通過與否。點姓名看完整報告。</p>'+
      '<div class="row"><button class="btn" data-act="t-mx-local">這台平板的紀錄（'+hist.length+' 筆）</button><button class="btn" data-act="t-mx-server">從試算表讀取全班</button></div><div id="mx-area"></div></div>'+
      '<div class="card"><h2>🗂️ 這台平板的紀錄</h2>'+(hist.length?'<table class="hist">'+hist.slice(0,60).map(function(r){
        return '<tr><td>'+fmtTime(r.ts)+'</td><td>'+esc(r.cls)+' '+esc(r.name)+'</td><td>'+esc(r.mode)+'</td><td>'+r.right+'/'+r.total+'</td><td><button class="btn small" data-act="hist-open" data-id="'+esc(r.id)+'" data-back="teacher">報告</button></td></tr>'; }).join('')+'</table>'
        :'<p class="muted">還沒有紀錄。</p>')+
      '<div class="row"><button class="btn" data-act="t-clear">清除這台平板的紀錄</button><button class="btn" data-act="hub">返回</button></div></div>');
    if(backendState==='unknown') checkBackend(true).then(function(){ var el=$('be-state'); if(el) el.innerHTML='後台狀態：'+state[backendState]; });
  }
  function matrixHTML(results){
    var latest={}, keys=[];
    results.forEach(function(r){ var k=r.cls+'\u0001'+r.name; if(!latest[k]){ keys.push(k); latest[k]=r; } else if(latest[k].ts<r.ts) latest[k]=r; });
    var list=keys.map(function(k){ return latest[k]; }).sort(function(a,b){ return a.cls===b.cls ? a.name.localeCompare(b.name,'zh-Hant') : (a.cls<b.cls?-1:1); });
    mxData=list;
    if(!list.length) return '<p class="muted">沒有資料。</p>';
    var cnt={}; CODE_ORDER.forEach(function(c){ cnt[c]=[0,0]; });
    var body=list.map(function(r,i){
      var pct=r.total?Math.round(r.right*100/r.total):0;
      return '<tr><td class="nm">'+esc(r.cls)+' <button class="linkbtn" data-act="mx-open" data-i="'+i+'">'+esc(r.name)+'</button><br><small>'+fmtTime(r.ts).slice(5)+'</small></td><td>'+pct+'%</td>'+
        CODE_ORDER.map(function(c){ var v=r.codes[c]; if(!v) return '<td>·</td>'; var s=statusOf(v[0],v[1]); cnt[c][1]++; if(s==='pass') cnt[c][0]++; return '<td class="s-'+s+'" title="'+c+' '+v[0]+'/'+v[1]+'">'+(s==='pass'?'✅':s==='weak'?'⚠️':'❌')+'</td>'; }).join('')+'</tr>'; }).join('');
    var foot='<tr><th>通過人數</th><th></th>'+CODE_ORDER.map(function(c){ return '<th>'+(cnt[c][1]?cnt[c][0]+'/'+cnt[c][1]:'·')+'</th>'; }).join('')+'</tr>';
    return '<div class="tblwrap rep"><table class="mx"><thead><tr><th>學生</th><th>答對率</th>'+CODE_ORDER.map(function(c){ return '<th class="code" title="'+esc(CODES[c].name)+'">'+c+(CODES[c].hot?'★':'')+'</th>'; }).join('')+'</tr></thead><tbody>'+body+'</tbody><tfoot>'+foot+'</tfoot></table></div>'+
      '<div class="row no-print"><button class="btn small" data-act="print">🖨️ 列印總表</button></div>';
  }
  /* ---------- 老師大螢幕 ---------- */
  function renderBoard(room){
    show('board','<div class="card board"><p class="center muted" style="font-size:20px">請孩子打開「數學勇士大挑戰」→「團體戰」，輸入房間號碼</p>'+
      '<div class="roomcode">'+esc(room)+'</div><div id="board-bars"><p class="muted center">等待孩子加入…</p></div></div>'+
      '<div class="card rep"><h3>📉 這個房間目前比較弱的指標</h3><div id="board-weak"><p class="muted">還沒有資料</p></div></div>'+
      '<div class="row no-print"><button class="btn" data-act="teacher">結束（回老師專區）</button></div>');
    function tick(){
      apiGet({action:'diagRoom', room:room}).then(function(d){
        if(!d || !d.teams) return;
        var b=$('board-bars'); if(b) b.innerHTML=d.teams.length?boardBars(d.teams,''):'<p class="muted center">等待孩子加入…</p>';
        var w=$('board-weak'); if(!w) return;
        var list=Object.keys(d.codes||{}).map(function(c){ return {c:c, r:d.codes[c][0], t:d.codes[c][1]}; }).filter(function(x){ return x.t>=2 && CODES[x.c]; })
          .sort(function(a,b){ return a.r/a.t-b.r/b.t; }).slice(0,6);
        w.innerHTML=list.length?'<table><thead><tr><th>指標</th><th>內容</th><th>答對率</th></tr></thead><tbody>'+list.map(function(x){
          return '<tr><td>'+x.c+'</td><td>'+esc(CODES[x.c].name)+'</td><td>'+Math.round(x.r*100/x.t)+'%（'+x.r+'/'+x.t+'）</td></tr>'; }).join('')+'</tbody></table>':'<p class="muted">還沒有資料</p>';
      }).catch(function(){});
    }
    tick(); timers.push(setInterval(tick, 5000));
  }
  /*/T*/

  /* ================= 按鈕 ================= */
  var ACT={
    'me-yes':function(){ renderHub(); },
    'logout':function(){ clearIdentity(); T=null; renderLogin(true); },
    'login':doLogin,
    'hub':function(){ T=null; renderHub(); },
    'zy':function(){ lsSet('nf_zy', zyPref()?'0':'1'); renderTop(); },
    'tts':function(){ lsSet('dx_tts', ttsPref()?'0':'1'); renderTop(); },
    'solo':function(){ startTest('solo'); },
    'retest':function(){
      var src=(lastReport && lastReport.name===(getIdentity()||{}).name)?lastReport:myHistory()[0];
      var codes=src?needCodes(src):[]; if(!codes.length){ renderHub(); return; }
      startTest('retest',{codes:codes});
    },
    'myhist':renderMyHistory,
    'join':renderJoin,
    'jkey':function(b){ var k=b.dataset.k; if(k==='del') join.code=join.code.slice(0,-1); else if(join.code.length<4) join.code+=k; $('jcode').innerHTML=join.code||'&nbsp;'; },
    'jteam':function(b){ join.team=b.dataset.t; document.querySelectorAll('.teambtn').forEach(function(x){ x.classList.toggle('sel', x.dataset.t===join.team); }); },
    'jstart':function(){
      if(!/^[1-9]\d{3}$/.test(join.code)){ $('jwarn').innerHTML=az('房間號碼是4個數字喔！'); return; }
      if(!join.team){ $('jwarn').innerHTML=az('請選一個隊伍！'); return; }
      startTest('team',{room:join.code, team:join.team});
    },
    'say':function(){ if(T) say(T.items[T.i].stem); },
    'pick':function(b){
      if(!T||T.locked) return; T.locked=true;
      var it=T.items[T.i], c=it.choices[parseInt(b.dataset.i,10)];
      b.classList.add(c.ok?'picked-ok':'picked-no');
      record(!!c.ok, c.t, c.err||'其他錯誤');
      afterAnswer(!!c.ok);
    },
    'key':function(b){
      if(!T||T.locked) return;
      var k=b.dataset.k, it=T.items[T.i];
      if(k==='del') T.num=T.num.slice(0,-1);
      else if(k==='ok'){
        if(!T.num){ $('fb').className='fb no'; $('fb').innerHTML=az('先按數字，再按確定喔！'); return; }
        T.locked=true;
        var v=parseInt(T.num,10), ok=v===it.num;
        record(ok, v+(it.unit||''), it.errs[v]||'其他錯誤');
        afterAnswer(ok); return;
      } else if(T.num.length<3) T.num=(T.num==='0'?'':T.num)+k;
      $('numval').innerHTML=T.num||'&nbsp;';
    },
    'dunno':function(){
      if(!T||T.locked) return; T.locked=true;
      record(false,'我不會','表示不會（沒有作答）');
      afterAnswer(false);
    },
    'next-area':function(){ if(!T) return; if(T.i>=T.items.length) finish(); else showQuestion(); },
    'print':function(){ window.print(); },
    'hist-open':function(b){
      var r=lsJSON('dx_history',[]).filter(function(x){ return x.id===b.dataset.id; })[0];
      if(r) renderReport(r,{back:b.dataset.back, mine:b.dataset.back==='myhist'});
    },
    'teacher':function(){ T=null; renderTeacher(); },
    't-save':function(){
      lsSet('nf_api', $('api-in').value.trim()); lsSet('dx_key', $('key-in').value.trim());
      backendState='unknown'; backendPromise=null; rosterCache=null; renderTeacher(); flushOutbox();
    },
    't-newroom':function(){ renderBoard(String(1000+Math.floor(Math.random()*9000))); },
    't-openroom':function(){ var v=($('room-in').value||'').trim(); if(/^[1-9]\d{3}$/.test(v)) renderBoard(v); else alert('請輸入 4 位數的房間號碼（第一位不是 0）'); },
    't-mx-local':function(){ $('mx-area').innerHTML=matrixHTML(lsJSON('dx_history',[])); },
    't-mx-server':function(){
      var key=lsGet('dx_key',''), area=$('mx-area');
      if(!key){ area.innerHTML='<p class="warn">請先在上方輸入老師金鑰並儲存。</p>'; return; }
      area.innerHTML='<p class="muted">讀取中…</p>';
      apiGet({action:'diagMatrix', key:key}).then(function(d){
        if(!d || !d.ok){ area.innerHTML='<p class="warn">讀取失敗：'+(d&&d.error==='forbidden'?'金鑰不正確，或 Code.gs 的 DX_TEACHER_KEY 還沒設定':'後台尚未更新')+'</p>'; return; }
        area.innerHTML=matrixHTML(d.results);
      }).catch(function(){ area.innerHTML='<p class="warn">連不上後台。</p>'; });
    },
    'mx-open':function(b){ var r=mxData[parseInt(b.dataset.i,10)]; if(r) renderReport(r,{back:'teacher'}); },
    't-clear':function(){ if(confirm('確定要清除這台平板上的所有診斷紀錄嗎？（試算表裡的資料不會被刪除）')){ lsDel('dx_history'); renderTeacher(); } }
  };
  document.getElementById('app').addEventListener('click', function(e){
    var b=e.target.closest('[data-act]'); if(!b) return;
    var f=ACT[b.dataset.act]; if(f){ e.preventDefault(); f(b,e); }
  });

  /* ================= 開始 ================= */
  renderTop();
  if(getIdentity()) renderLogin(false); else renderLogin(true);
  flushOutbox();
})();
</script>
</body>
</html>
