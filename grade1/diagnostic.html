<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數學勇士大挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/diagnostic.css">
</head>
<body>
<div id="app"></div>
<noscript>這個遊戲需要開啟 JavaScript。</noscript>
<script src="../shared/diagnostic.js"></script>
<script>
/* 數學勇士大挑戰（一年級）：題庫
 * 題型參考 109–114 年一年級數學篩選測驗與〈學扶題對照表〉，依基本學習內容代碼出「仿題」，
 * 數字每次隨機產生，每個錯誤選項都標註它代表的常見迷思。遊戲引擎在 ../shared/diagnostic.js。 */
(function(){
  "use strict";
  var D=window.DX, az=D.az, rnd=D.rnd, ri=D.ri, pick=D.pick, shuffle=D.shuffle, sample=D.sample, rep=D.rep, mk=D.mk,
      cnNum=D.cnNum, mc=D.mc, Q=D.Q, emo=D.emo, grp=D.grp, MONTH_DAYS=D.MONTH_DAYS,
      svgBeads=D.svgBeads, svgSticks=D.svgSticks, svgEggs=D.svgEggs, svgCoins=D.svgCoins, svgClock=D.svgClock,
      svgClockRaw=D.svgClockRaw, svgCal=D.svgCal, svgPencil=D.svgPencil, svgClipRibbons=D.svgClipRibbons,
      svgRibbons=D.svgRibbons, svgRoute=D.svgRoute, svgCubes=D.svgCubes, svgShape=D.svgShape;

  /* ---------- NC-1-1-1 100以內數的命名及說、讀、聽、寫、做 ---------- */
  function g111_beads(){
    var k=ri(3,8), m=ri(1,9), c=10*k+m;
    return Q('一串珠子有10顆。數數看，下面一共有幾顆珠子？', {vis:svgBeads(k,m), choices:mc(c+'顆',[
      [(k+m)+'顆','把一串當成1顆，還沒建立「1個十＝10個一」'],[(10*m+k)+'顆','十位和個位顛倒'],
      [(10*k)+'顆','漏數了單顆的珠子'],[(c+10)+'顆','多數了一串']])});
  }
  function g111_seq(){
    if(rnd()<0.5){ var t=ri(3,8), s=10*t+3;
      return Q(s+' → '+(s-1)+' → '+(s-2)+' → '+(s-3)+' → （　）\n照順序填填看，（　）裡是多少？', {num:10*t-1, errs:mk([
        [10*t+9,'往下數跨過整十時，十位沒有退1（例如'+(10*t)+'後面寫'+(10*t+9)+'）'],[10*(t-1),'往下數跨過整十時數錯'],[10*t+1,'沒看出數字是一個一個變小']])});
    }
    var o=ri(1,9), a=ri(0,2), seq=[a*10+o, a*10+10+o, a*10+20+o], ans=a*10+30+o;
    return Q(seq.join(' → ')+' → （　） → '+(ans+10)+'\n照順序填填看，（　）裡是多少？', {num:ans, errs:mk([
      [seq[2]+1,'沒看出是10個10個數，只加了1'],[ans+10,'跳過了一個數'],[a*10+30,'10個一數時，個位數字跟著改變了']])});
  }
  function g111_write(){
    var t=ri(2,9), o=ri(1,9), n=10*t+o;
    return Q('「'+cnNum(n)+'」寫成數字是多少？', {choices:mc(n,[
      [String(t)+'0'+o,'依照讀音逐字寫（「'+cnNum(n)+'」寫成'+t+'0'+o+'）'],[10*o+t,'十位和個位顛倒'],[10*t,'漏寫了個位'],[t+o,'把十位和個位的數字相加']])});
  }
  function g111_eggs(){
    var b=ri(4,8), l=ri(1,9), take=ri(2,3), c=(b-take)*10+l, tot=b*10+l;
    return Q('一盒雞蛋有10顆。從下面的雞蛋拿走'+(take*10)+'顆後，還剩下幾顆雞蛋？', {vis:svgEggs(b,l), choices:mc(c+'顆',[
      [(tot-take)+'顆','把拿走'+(take*10)+'顆看成拿走'+take+'顆，「十」和「一」的單位混淆'],[tot+'顆','只數出全部的雞蛋，沒有拿走'],
      [(c+10)+'顆','少拿走了一盒'],[(b-take+l)+'顆','把一盒當成1顆來算']])});
  }

  /* ---------- NC-1-1-2 個位、十位，位值換算 ---------- */
  function g112_digit(){
    var tens=rnd()<0.6, d=ri(2,9), o, o2;
    do{ o=ri(1,9); }while(o===d);
    do{ o2=ri(1,9); }while(o2===d||o2===o);
    if(tens) return Q('下面哪個數的十位數字是'+d+'？', {choices:mc(10*d+o,[
      [10*o+d,'分不清個位和十位'],[10*o2+d,'分不清個位和十位'],[d,'以為'+d+'的十位數字就是'+d+'（還不清楚一位數沒有十位）']])});
    return Q('下面哪個數的個位數字是'+d+'？', {choices:mc(10*o+d,[
      [10*d+o,'分不清個位和十位'],[10*d+o2,'分不清個位和十位'],[10*d,'分不清個位和十位']])});
  }
  function g112_pack(){
    var a=ri(3,9), b=ri(1,9), c=10*a+b;
    var p=pick([['一包貼紙有10張','包','張','貼紙'],['一盒蠟筆有10枝','盒','枝','蠟筆'],['一袋糖果有10顆','袋','顆','糖果']]);
    return Q(p[0]+'。'+a+p[1]+'又'+b+p[2]+'，一共是多少'+p[2]+p[3]+'？', {choices:mc(c+p[2],[
      [(a+b)+p[2],'把'+p[1]+'數和'+p[2]+'數直接相加，沒有把1'+p[1]+'換成10'+p[2]],[(10*b+a)+p[2],'十位和個位顛倒'],
      [(a*100+b)+p[2],'依照讀音寫成三位數'],[(10*a)+p[2],'漏掉了單獨的'+b+p[2]]])});
  }
  function g112_regroup(){
    var a=ri(2,6), b=ri(10,15), c=10*a+b;
    return Q(a+'個十和'+b+'個一合起來是多少？', {choices:mc(c,[
      [a+b,'把「十」和「一」的個數直接相加'],[String(a)+String(b),'把兩個數字直接並排寫'],
      [c-10,'沒有把'+b+'個一換成1個十和'+(b-10)+'個一'],[c+10,'換算時多算了1個十']])});
  }
  function g112_decomp(){
    var t=ri(2,9), o; do{ o=ri(1,9); }while(o===t);
    var n=10*t+o;
    return Q(n+'是幾個十和幾個一？', {long:true, choices:mc(t+'個十和'+o+'個一',[
      [o+'個十和'+t+'個一','十位和個位顛倒'],[(10*t)+'個十和'+o+'個一','把十位的值'+(10*t)+'當成十的個數'],[t+'個十和'+(10*o)+'個一','位值概念不清楚']])});
  }
  function g112_bundle(){
    var n=ri(23,79); if(n%10===0) n++;
    var t=Math.floor(n/10), o=n%10;
    return Q('10朵花綁成1束。'+n+'朵花可以綁成幾束又幾朵？', {long:true, choices:mc(t+'束又'+o+'朵',[
      [o+'束又'+t+'朵','十位和個位顛倒'],[(t+1)+'束又'+o+'朵','換算時多算了1束'],['1束又'+o+'朵','不知道'+t+'個十就是'+t+'束']])});
  }

  /* ---------- NC-1-1-3 比大小 ---------- */
  function g113_max(){
    if(rnd()<0.6){ var t=ri(5,9), o=ri(0,3), c=10*t+o;
      return Q('下面哪一個數最大？', {choices:mc(c,[
        [10*(t-1)+9,'沒有先比十位，只看個位數字'],[o>0?10*o+t:10*(t-2)+ri(5,8), o>0?'把十位和個位看反了':'沒有先比十位'],
        [10*(t-2)+ri(4,8),'沒有先比十位'],[10*(t-3)+ri(5,9),'沒有先比十位']])});
    }
    var t2=ri(1,4), o2=ri(6,9), c2=10*t2+o2;
    return Q('下面哪一個數最小？', {choices:mc(c2,[
      [10*(t2+1)+ri(0,2),'沒有先比十位，只看個位數字'],[10*o2+t2,'把十位和個位看反了'],
      [10*(t2+2)+ri(0,9),'沒有先比十位'],[10*(t2+3)+ri(0,9),'沒有先比十位']])});
  }
  function g113_sticks(){
    var b1=ri(3,5), l1=ri(0,3), b2=b1-1, l2=ri(6,9), leftMore=rnd()<0.5;
    var A=leftMore?[b1,l1]:[b2,l2], B=leftMore?[b2,l2]:[b1,l1];
    return Q('10根吸管綁成一捆。甲、乙哪一邊的吸管比較多？', {
      vis:'<div class="pair"><div><b>'+az('甲')+'</b>'+svgSticks(A[0],A[1])+'</div><div><b>'+az('乙')+'</b>'+svgSticks(B[0],B[1])+'</div></div>',
      choices:mc(leftMore?'甲':'乙',[[leftMore?'乙':'甲','被零散的根數吸引，沒有把一捆看成10根'],['一樣多','還不會比較兩堆數量的多少']])});
  }

  /* ---------- NC-1-1-4 序數 ---------- */
  var SHAPES=[['⭐','星星'],['❤️','愛心'],['🌙','月亮'],['🍀','幸運草'],['🔺','三角形'],['🟦','方塊'],['⚪','圓形'],['🍎','蘋果']];
  function g114_row(){
    var row=shuffle(SHAPES), fromRight=rnd()<0.6, n=ri(3,6), iR=row.length-n, iL=n-1;
    var c=fromRight?row[iR]:row[iL], wd=fromRight?row[iL]:row[iR], nb1=fromRight?row[iR-1]:row[iL+1], nb2=fromRight?row[iR+1]:row[iL-1];
    function o(s){ return {t:s[1], h:emo(s[0])}; }
    return Q('從'+(fromRight?'右':'左')+'邊開始數，第'+n+'個是什麼？', {
      vis:'<div class="rowline"><span class="lr">'+az('左')+'</span>'+row.map(function(s){ return emo(s[0]); }).join('')+'<span class="lr">'+az('右')+'</span></div>',
      choices:mc(o(c),[[o(wd),'數的方向錯了（沒有從'+(fromRight?'右':'左')+'邊開始數）'],[o(nb1),'數的時候多數或少數了一個'],[o(nb2),'數的時候多數或少數了一個']])});
  }
  function g114_boys(){
    var pos; do{ pos=sample([1,2,3,4,5,6,7],3).sort(function(a,b){ return a-b; }); }while(pos[2]<4);
    return Q('有10個人排隊，第'+pos[0]+'個、第'+pos[1]+'個和第'+pos[2]+'個是男生，其他都是女生。有幾個男生？', {choices:mc('3個',[
      [pos[2]+'個','把「第'+pos[2]+'個」當成「'+pos[2]+'個」'],[(pos[0]+pos[1]+pos[2])+'個','把排第幾個的數字相加'],['7個','算成了女生的人數']],
      {base:3,unit:'個',err:'序數和數量混淆'})});
  }
  function g114_between(){
    var nm=pick([['清清','芳芳'],['小葵','小新'],['阿明','小美']]), p=ri(1,4), q=p+ri(3,6), c=q-p-1;
    return Q('排隊時，'+nm[0]+'排在第'+q+'個，'+nm[1]+'排在第'+p+'個。兩個人中間有幾個人？', {choices:mc(c+'個',[
      [(q-p)+'個','直接相減，多算了1個人'],[(q-p+1)+'個','把兩個人自己也算進去了'],[q+'個','只看了排在後面的人是第幾個']],{base:c,unit:'個'})});
  }
  function g114_front(){
    var n=ri(12,48);
    return Q('媽媽排隊買票，她排在第'+n+'個。她的前面有幾個人？', {num:n-1, unit:'個', errs:mk([
      [n,'把「第'+n+'個」當成前面有'+n+'個人'],[n+1,'序數和數量的關係不清楚']])});
  }

  /* ---------- NC-1-1-5 2個一數、5個一數、10個一數 ---------- */
  function g115_groups(){
    var t=pick([['🍰',2,'一個盤子放了2塊蛋糕','塊','蛋糕','盤'],['🍎',5,'一袋蘋果有5顆','顆','蘋果','袋'],['🍓',2,'一盤草莓有2顆','顆','草莓','盤'],['🎈',5,'一束氣球有5顆','顆','氣球','束']]);
    var n=t[1]===2?ri(5,9):ri(4,7), c=n*t[1], v='<div class="groups">';
    for(var i=0;i<n;i++) v+=grp(t[0],t[1]);
    return Q(t[2]+'。數數看，下面一共有幾'+t[3]+t[4]+'？', {vis:v+'</div>', choices:mc(c+t[3],[
      [n+t[3],'只數了有幾'+t[5]+'，沒有'+t[1]+'個一數'],[(c-t[1])+t[3],t[1]+'個一數時漏數了一'+t[5]],
      [(c+t[1])+t[3],t[1]+'個一數時多數了一'+t[5]],[(n+t[1])+t[3],'把'+t[5]+'數和每'+t[5]+'的數量相加']])});
  }
  function g115_seq(){
    var step=pick([2,5,10]), start=step===10?ri(1,9):step, k=ri(0,2), arr=[];
    for(var i=0;i<5;i++) arr.push(start+step*(i+k));
    var ans=arr[3], shown=arr.map(function(v,i){ return i===3?'（　）':v; }).join('、');
    return Q(step+'個一數，填填看：'+shown, {num:ans, errs:mk([
      [arr[2]+1,'沒有'+step+'個一數，只加了1'],[ans+step,'跳過了一個數'],[ans-step,'數字重複或往回數了']])});
  }

  /* ---------- NC-1-2-1 加減的意義與算式 ---------- */
  function g121_parts(){
    var a=ri(5,9), b=ri(3,9); if(a===b) b=a-2;
    var c=a+b;
    return Q('下面哪一個算式的被加數是'+a+'，加數是'+b+'，和是'+c+'？', {choices:mc(a+' + '+b+' = '+c,[
      [b+' + '+a+' = '+c,'分不清被加數和加數的位置'],[c+' − '+b+' = '+a,'不了解加法算式各部分的名稱'],[c+' − '+a+' = '+b,'不了解加法算式各部分的名稱']])});
  }
  function g121_story(){
    if(rnd()<0.5){
      var a=ri(4,8), b=ri(2,Math.min(5,a-1)), s=a+b, an=pick([['🐦','樹上有','隻小鳥，又飛來','隻'],['🐟','魚缸裡有','條魚，又放進','條']]);
      return Q(an[1]+a+an[2]+b+an[3]+'。哪一個算式可以記錄這件事？', {
        vis:'<div class="groups">'+grp(an[0],a)+'<span class="plus">＋</span>'+grp(an[0],b)+'</div>',
        choices:mc(a+' + '+b+' = '+s,[[a+' − '+b+' = '+(a-b),'把「又來了」想成減法'],[s+' − '+b+' = '+a,'算式和事情發生的順序不相符'],[a+' + '+a+' = '+(2*a),'算式中的數字和題目不相符']])});
    }
    var x=ri(8,15), y=ri(3,7), d=x-y;
    return Q('盤子裡有'+x+'顆糖果，吃掉'+y+'顆。哪一個算式可以記錄這件事？', {vis:'<div class="groups">'+grp('🍬',x)+'</div>',
      choices:mc(x+' − '+y+' = '+d,[[x+' + '+y+' = '+(x+y),'把「吃掉」想成加法'],[y+' + '+d+' = '+x,'算式和事情發生的順序不相符'],[(x+y)+' − '+y+' = '+x,'算式中的數字和題目不相符']])});
  }
  function g121_sum(){
    var a=ri(5,9), b=ri(3,8); if(a===b) b--;
    var c=a+b, w=pick(['和','被加數','加數']), ans=w==='和'?c:w==='被加數'?a:b;
    return Q('在「'+a+' + '+b+' = '+c+'」這個算式裡，'+w+'是多少？', {choices:mc(ans,[
      [a,'不認識加法算式中「'+w+'」的意思'],[b,'不認識加法算式中「'+w+'」的意思'],[c,'不認識加法算式中「'+w+'」的意思']])});
  }

  /* ---------- NC-1-2-2 加減解題 ---------- */
  function g122_locker(){
    var o=ri(4,9), a=10*ri(2,3)+o, b=ri(Math.max(10-o,2),9), c=a+b;
    return Q('班上有'+a+'位學生，每位學生分到一個置物櫃後，還多出'+b+'個置物櫃。班上一共有幾個置物櫃？', {choices:mc(c+'個',[
      [(a-b)+'個','看到「多出」卻用減法，題意理解錯誤'],[(c-10)+'個','加法進位時算錯'],[a+'個','只看了學生的人數'],[(c+10)+'個','加法進位時算錯']])});
  }
  function g122_seat(){
    if(rnd()<0.5){ var a=ri(5,9), b=ri(11,16);
      return Q('有'+a+'張椅子和'+b+'個小朋友，一個小朋友坐一張椅子。有幾個小朋友沒有椅子可以坐？', {num:b-a, unit:'個', errs:mk([
        [a+b,'誤用加法，題意理解錯誤'],[b-a+1,'減法計算錯誤'],[b-a-1,'減法計算錯誤'],[b,'沒有把有椅子坐的人去掉']])});
    }
    var k=ri(4,8), r=ri(11,17);
    return Q('有'+k+'個小朋友和'+r+'條跳繩，一個小朋友拿走1條跳繩。還剩下幾條跳繩？', {num:r-k, unit:'條', errs:mk([
      [r+k,'誤用加法，題意理解錯誤'],[r-k+1,'減法計算錯誤'],[r-k-1,'減法計算錯誤'],[r-1,'以為只拿走了1條']])});
  }
  function g122_compare(){
    var big=ri(12,19), small=ri(5,9), d=big-small, p=pick([['哥哥','弟弟'],['姐姐','妹妹']]), more=rnd()<0.5;
    var q=p[0]+'有'+big+'元，'+p[1]+'有'+small+'元。'+(more?p[0]+'比'+p[1]+'多幾元？':p[1]+'比'+p[0]+'少幾元？');
    return Q(q, {choices:mc(d+'元',[
      [(big+small)+'元', more?'看到「多」就用加法，比較型問題理解錯誤':'用加法解比較型問題'],[big+'元','只看了其中一個人的錢'],[(d+10)+'元','退位計算錯誤']])});
  }
  function g122_more(){
    var a=ri(6,9), d=ri(2,4);
    return Q('甲盤有'+a+'顆蘋果，甲盤比乙盤多'+d+'顆。也可以說，乙盤比甲盤少幾顆？', {
      vis:'<div class="groups"><b>'+az('甲盤')+'</b>'+grp('🍎',a)+'</div>', choices:mc(d+'顆',[
      [(a-d)+'顆','算成乙盤的數量，不了解「多幾個」和「少幾個」是同一個差'],[(a+d)+'顆','用加法，不了解「多幾個」和「少幾個」是同一個差'],[a+'顆','只看了甲盤的數量']])});
  }
  function g122_take(){
    var t=ri(2,6), o=ri(1,5), a=10*t+o, b=ri(o+1,9), c=a-b;
    return Q('哥哥有'+a+'顆巧克力，送給同學'+b+'顆。哥哥還剩下幾顆巧克力？', {choices:mc(c+'顆',[
      [(a+b)+'顆','看到「送給」卻用加法'],[(10*t+(b-o))+'顆','個位不夠減時，用大數減小數（'+o+'−'+b+'算成'+b+'−'+o+'）'],
      [(c+10)+'顆','退位時十位沒有減1'],[(c-10)+'顆','退位後計算錯誤']])});
  }

  /* ---------- NC-1-3-1 基本加減 ---------- */
  function g131_add(){
    var a=ri(4,9), b=ri(Math.max(11-a,2),9), c=a+b;
    return Q('算算看：'+a+' + '+b+' = （　）', {num:c, errs:mk([
      [c-10,'進位時漏了十，只寫了個位'],[c-1,'可能用扳手指數數，少數了1'],[c+1,'可能用扳手指數數，多數了1']])});
  }
  function g131_sub(){
    if(rnd()<0.6){ var x=ri(1,7), b=ri(x+2,9), a=10+x, c=a-b;
