<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數學勇士大挑戰 二年級</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/diagnostic.css">
</head>
<body>
<div id="app"></div>
<noscript>這個遊戲需要開啟 JavaScript。</noscript>
<script src="../shared/diagnostic.js"></script>
<script>
/* 數學勇士大挑戰（二年級）：題庫
 * 題型參考 110–114 年二年級數學篩選測驗、〈學扶題對照表〉與 114 年「通過率最低前 5 題」，
 * 依二年級基本學習內容代碼出「仿題」，數字每次隨機產生，每個錯誤選項都標註它代表的常見迷思。
 * 遊戲引擎在 ../shared/diagnostic.js。 */
(function(){
  "use strict";
  var D=window.DX, az=D.az, rnd=D.rnd, ri=D.ri, pick=D.pick, shuffle=D.shuffle, sample=D.sample, rep=D.rep, mk=D.mk,
      mc=D.mc, Q=D.Q, emo=D.emo, grp=D.grp, svgWrap=D.svgWrap, svgMoney=D.svgMoney, svgClock=D.svgClock, svgClockRaw=D.svgClockRaw;

  /* ---------- 小工具 ---------- */
  var CN=['零','一','二','三','四','五','六','七','八','九'];
  function cn3(n){ // 三位數的國字讀法，例如 305 → 三百零五
    var h=Math.floor(n/100), t=Math.floor(n/10)%10, o=n%10, s=CN[h]+'百';
    if(t) s+=CN[t]+'十'; else if(o) s+='零';
    if(o) s+=CN[o];
    return s;
  }
  function pad2(n){ return (n<10?'0':'')+n; }
  function noCarry(a,b){ var r=0, p=1; while(a>0||b>0){ r+=((a%10+b%10)%10)*p; a=Math.floor(a/10); b=Math.floor(b/10); p*=10; } return r; }
  function bigMinusSmall(a,b){ var r=0, p=1; while(a>0||b>0){ r+=Math.abs(a%10-b%10)*p; a=Math.floor(a/10); b=Math.floor(b/10); p*=10; } return r; }
  function vert(a,b,op){
    var A=String(a), B=String(b), n=Math.max(A.length,B.length);
    function cells(s){ var out=''; while(s.length<n) s=' '+s; for(var i=0;i<n;i++) out+='<td>'+(s[i]===' '?'':s[i])+'</td>'; return out; }
    return '<table class="vert" aria-hidden="true"><tr><td></td>'+cells(A)+'</tr><tr><td>'+op+'</td>'+cells(B)+'</tr><tr class="line"><td></td>'+rep('<td>&nbsp;</td>',n)+'</tr></table>';
  }
  function decompose(T){ var out=[]; [500,100,50,10,5,1].forEach(function(v){ while(T>=v){ out.push(v); T-=v; } }); return out; }

  /* ---------- 二年級的圖 ---------- */
  function svgBlocks(h,t,o){
    var s='', x=4, i, j, c=6;
    for(i=0;i<h;i++){ s+='<rect x="'+x+'" y="4" width="60" height="60" class="cf"/>';
      for(j=1;j<10;j++) s+='<line x1="'+(x+j*c)+'" y1="4" x2="'+(x+j*c)+'" y2="64" class="bl"/><line x1="'+x+'" y1="'+(4+j*c)+'" x2="'+(x+60)+'" y2="'+(4+j*c)+'" class="bl"/>';
      x+=68; }
    for(i=0;i<t;i++){ s+='<rect x="'+x+'" y="4" width="'+c+'" height="60" class="cf"/>';
      for(j=1;j<10;j++) s+='<line x1="'+x+'" y1="'+(4+j*c)+'" x2="'+(x+c)+'" y2="'+(4+j*c)+'" class="bl"/>';
      x+=c+6; }
    x+=6;
    for(i=0;i<o;i++){ s+='<rect x="'+(x+(i%5)*10)+'" y="'+(i<5?56:44)+'" width="'+c+'" height="'+c+'" class="cf"/>'; }
    return svgWrap(x+(o?52:0)+4, 68, s);
  }
  function svgRuler(from, to, obj){
    var U=28, x0=18, W=x0*2+(to-from)*U, s="", v;
    function X(v){ return x0+(v-from)*U; }
    if(obj.kind==='pencil'){ var xa=X(obj.a), xb=X(obj.b);
      s+='<rect x="'+xa+'" y="16" width="10" height="16" rx="3" class="eraser"/><rect x="'+(xa+10)+'" y="16" width="'+(xb-xa-28)+'" height="16" class="pencil"/>'+
         '<polygon points="'+(xb-18)+',16 '+xb+',24 '+(xb-18)+',32" class="wood"/><polygon points="'+(xb-6)+',22 '+xb+',24 '+(xb-6)+',26" class="lead"/>'+
         '<line x1="'+xa+'" y1="8" x2="'+xa+'" y2="48" class="guide"/><line x1="'+xb+'" y1="8" x2="'+xb+'" y2="48" class="guide"/>';
    } else {
      obj.flags.forEach(function(f){ var x=X(f.v);
        s+='<line x1="'+x+'" y1="8" x2="'+x+'" y2="48" class="pole"/><polygon points="'+x+',8 '+(x+16)+',14 '+x+',20" class="flag"/><text x="'+(x+12)+'" y="38" class="lbl" style="font-size:15px">'+f.lab+'</text>'; });
    }
    s+='<rect x="4" y="48" width="'+(W-8)+'" height="36" rx="4" class="ruler"/>';
    for(v=from; v<=to; v++){ var x=X(v);
      s+='<line x1="'+x+'" y1="48" x2="'+x+'" y2="62" class="rtk"/><text x="'+x+'" y="78" class="rnum">'+v+'</text>';
      if(v<to) s+='<line x1="'+(x+U/2)+'" y1="48" x2="'+(x+U/2)+'" y2="56" class="rtk2"/>'; }
    return svgWrap(W, 88, s);
  }
  function svgBalance(leftHeavy, L, Rt){
    var yl=leftHeavy?72:40, yr=leftHeavy?40:72, s='';
    s+='<line x1="180" y1="56" x2="180" y2="140" class="beam"/><rect x="140" y="138" width="80" height="8" rx="4" class="pan"/>';
    s+='<line x1="60" y1="'+yl+'" x2="300" y2="'+yr+'" class="beam"/>';
    [[60,yl,L],[300,yr,Rt]].forEach(function(p){ var x=p[0], y=p[1];
      s+='<line x1="'+x+'" y1="'+y+'" x2="'+(x-26)+'" y2="'+(y+30)+'" class="string"/><line x1="'+x+'" y1="'+y+'" x2="'+(x+26)+'" y2="'+(y+30)+'" class="string"/>'+
         '<path d="M'+(x-32)+','+(y+30)+' Q'+x+','+(y+50)+' '+(x+32)+','+(y+30)+' Z" class="pan"/><text x="'+x+'" y="'+(y+28)+'" class="emoc">'+p[2]+'</text>'; });
    return svgWrap(360, 150, s);
  }
  function svgBottle(frac){
    var top=12, bot=96, xl0=34, xr0=56, xl1=8, xr1=82;
    function xl(y){ return xl0+(xl1-xl0)*(y-top)/(bot-top); }
    function xr(y){ return xr0+(xr1-xr0)*(y-top)/(bot-top); }
    var wy=bot-(bot-top)*frac;
    return svgWrap(90,104,'<polygon points="'+xl(wy).toFixed(1)+','+wy.toFixed(1)+' '+xr(wy).toFixed(1)+','+wy.toFixed(1)+' '+xr1+','+bot+' '+xl1+','+bot+'" class="water"/>'+
      '<polyline points="'+xl0+','+top+' '+xl1+','+bot+' '+xr1+','+bot+' '+xr0+','+top+'" class="glass"/>');
  }
  function svgPolygon(n){
    var pts=[], st=-90+(n%2===0?180/n:0);
    for(var i=0;i<n;i++){ var a=(st+i*360/n)*Math.PI/180; pts.push((90+74*Math.cos(a)).toFixed(1)+','+(90+74*Math.sin(a)).toFixed(1)); }
    return svgWrap(180,180,'<polygon points="'+pts.join(' ')+'" class="shp"/>');
  }
  function svgRectLab(w,h){
    var S=24, x0=40, y0=30, s='<rect x="'+x0+'" y="'+y0+'" width="'+(w*S)+'" height="'+(h*S)+'" class="shp"/>';
    s+='<text x="'+(x0+w*S/2)+'" y="'+(y0-10)+'" class="side">'+w+'</text><text x="'+(x0-16)+'" y="'+(y0+h*S/2+6)+'" class="side">'+h+'</text>';
    s+='<text x="'+(x0+w*S+8)+'" y="'+(y0+h*S+4)+'" class="side" style="text-anchor:start;font-size:13px">（單位：公分）</text>';
    return svgWrap(x0+w*S+110, y0+h*S+12, s);
  }
  function svgGrid(cells, cols, rows){
    var S=38, s='', i, j;
    for(i=0;i<=cols;i++) s+='<line x1="'+(4+i*S)+'" y1="4" x2="'+(4+i*S)+'" y2="'+(4+rows*S)+'" class="gridl"/>';
    for(j=0;j<=rows;j++) s+='<line x1="4" y1="'+(4+j*S)+'" x2="'+(4+cols*S)+'" y2="'+(4+j*S)+'" class="gridl"/>';
    cells.forEach(function(c){ s+='<rect x="'+(4+c[0]*S)+'" y="'+(4+c[1]*S)+'" width="'+S+'" height="'+S+'" class="gfill"/>'; });
    return svgWrap(8+cols*S, 8+rows*S, s);
  }
  function svgRegion(shape, where){
    var s, p;
    if(shape==='square'){ s='<rect x="50" y="20" width="120" height="120" class="region"/>';
      p=where==='in'?[110+ri(-25,25),88+ri(-25,25)]:where==='edge'?pick([[110,28],[170,88],[50,88],[110,148]]):pick([[200,40],[22,130],[205,140]]); }
    else { s='<circle cx="110" cy="80" r="62" class="region"/>';
      p=where==='in'?[110+ri(-20,20),88+ri(-20,20)]:where==='edge'?pick([[172,88],[48,88],[110,26]]):pick([[200,30],[22,140],[205,150]]); }
    return svgWrap(224,160, s+'<text x="'+p[0]+'" y="'+p[1]+'" class="star">★</text>');
  }
  function svgDots(inside, outside){
    var s='<rect x="60" y="16" width="120" height="120" class="region"/>', i;
    for(i=0;i<inside;i++){ var cx=78+(i%4)*28+ri(-4,4), cy=36+Math.floor(i/4)*30+ri(-4,4); s+='<circle cx="'+cx+'" cy="'+cy+'" r="7" class="dot"/>'; }
    for(i=0;i<outside;i++){ var left=i%2===0, ox=left?22+ri(-6,6):218+ri(-6,6), oy=28+Math.floor(i/2)*34; s+='<circle cx="'+ox+'" cy="'+oy+'" r="7" class="dot"/>'; }
    return svgWrap(240,152,s);
  }

  /* ---------- NC-2-1-1 1000以內數的命名及說、讀、聽、寫、做 ---------- */
  function g211_write(){
    var h=ri(2,9), form=pick(['zeroTen','zeroOne','full']), t, o;
    if(form==='zeroTen'){ t=0; o=ri(1,9); } else if(form==='zeroOne'){ t=ri(1,9); o=0; } else { t=ri(1,9); do{ o=ri(1,9); }while(o===t); }
    var n=100*h+10*t+o, w;
    if(form==='zeroTen') w=[[String(h)+'00'+o,'依照讀音逐字寫，多寫了0'],[10*h+o,'漏寫了十位的0'],[100*h+10*o,'0寫錯了位置']];
    else if(form==='zeroOne') w=[[String(h)+'0'+t+'0','依照讀音逐字寫，多寫了0'],[10*h+t,'漏寫了個位的0'],[100*h+t,'十位和個位的位置弄錯了']];
    else w=[[100*h+10*o+t,'十位和個位顛倒'],[String(h)+'00'+t+'0'+o,'依照讀音逐字寫'],[h+t+o,'把各位的數字相加']];
    return Q('「'+cn3(n)+'」寫成數字是多少？', {choices:mc(n,w)});
  }
  function g211_blocks(){
    var h=ri(2,5), t=pick([0,ri(1,9),ri(1,9)]), o=ri(1,9), n=100*h+10*t+o;
    var w=[[h+t+o,'把積木的塊數直接相加，還沒建立「百、十、一」的位值'],[100*h+10*o+t,'十位和個位顛倒']];
    if(t) w.push([100*h+o,'漏數了十條']); else w.push([10*h+o,'十位沒有積木時，忘了寫0']);
    w.push([10*h+t*10+o,'把一片當成10']);
    return Q('一片積木是100，一條是10，一小塊是1。下面的積木一共是多少？', {vis:svgBlocks(h,t,o), choices:mc(n,w)});
  }
  function g211_seq(){
    var h=ri(2,8);
    if(rnd()<0.5){ var s=100*h-2;
      return Q(s+'、'+(s+1)+'、（　）、'+(s+3)+'\n照順序填填看，（　）裡是多少？', {num:100*h, errs:mk([
        [(h-1)*1000+910,'跨過整百時，把'+(s+1)+'的下一個數寫成「'+((h-1)*1000+910)+'」'],[100*(h-1),'跨過整百時，百位沒有進1'],[100*h+10,'跨過整百時數錯']])});
    }
    var a=100*h-20;
    return Q(a+'、'+(a+10)+'、（　）、'+(a+30)+'\n10個10個數，（　）裡是多少？', {num:100*h, errs:mk([
      [(h-1)*1000+100,'跨過整百時，把'+(a+10)+'的下一個數寫成「'+((h-1)*1000+100)+'」'],[100*(h-1),'跨過整百時，百位沒有進1'],[a+11,'沒有10個10個數，只加了1']])});
  }

  /* ---------- NC-2-1-2 百位、位值換算 ---------- */
  function g212_digit(){
    var ds=sample([1,2,3,4,5,6,7,8,9],3), n=100*ds[0]+10*ds[1]+ds[2], tens=rnd()<0.6, d=tens?ds[1]:ds[0];
    var e1='知道位名，但不知道這個數字代表的值', e2='位名弄錯了（分不清百位、十位、個位）';
    if(tens) return Q('下面有關 '+n+' 中「'+d+'」的說法，哪一個正確？', {long:true, choices:mc(d+'是十位數字，表示'+(10*d),[
      [d+'是十位數字，表示'+d,e1],[d+'是個位數字，表示'+d,e2],[d+'是百位數字，表示'+(100*d),e2]])});
    return Q('下面有關 '+n+' 中「'+d+'」的說法，哪一個正確？', {long:true, choices:mc(d+'是百位數字，表示'+(100*d),[
      [d+'是百位數字，表示'+d,e1],[d+'是十位數字，表示'+(10*d),e2],[d+'是個位數字，表示'+d,e2]])});
  }
  function g212_regroup(){
    if(rnd()<0.6){ var h=ri(2,8), t=ri(1,9), o=ri(10,15), n=100*h+10*t+o;
      return Q(h+'個百、'+t+'個十和'+o+'個一，合起來是多少？', {choices:mc(n,[
        [String(h)+String(t)+String(o),'把個數直接並排寫'],[n-10,'沒有把'+o+'個一換成1個十和'+(o-10)+'個一'],[h+t+o,'把百、十、一的個數直接相加']])});
    }
    var h2=ri(2,7), t2=ri(11,19), n2=100*h2+10*t2;
    return Q(h2+'個百和'+t2+'個十，合起來是多少？', {choices:mc(n2,[
      [String(h2)+String(t2),'把個數直接並排寫'],[n2-100,'沒有把10個十換成1個百'],[h2+t2,'把百和十的個數直接相加']])});
  }
  function g212_tens(){
    var k; do{ k=ri(21,99); }while(k%10===0);
    var n=10*k;
    return Q(n+'是幾個十？', {choices:mc(k+'個十',[
      [Math.floor(k/10)+'個十','只看了百位數字'],[n+'個十','把整個數當成十的個數'],[(k%10)+'個十','只看了十位數字']])});
  }

  /* ---------- RC-2-1-1 用＜、＝、＞表示大小 ---------- */
  var CMP_ERR='還不會用「＞、＜、＝」表示兩邊的大小關係';
  function cmpChoices(L,Rv){ var sym=L>Rv?'＞':L<Rv?'＜':'＝'; return mc(sym, ['＞','＜','＝'].filter(function(x){ return x!==sym; }).map(function(x){ return [x,CMP_ERR]; })); }
  function g2r11_cmp(){
    var k=pick(['addmul','addsub','num']), L, Rv, ls, rs;
    if(k==='addmul'){ var a=ri(2,6), b=ri(2,6); L=a+b; Rv=a*b; ls=a+' + '+b; rs=a+' × '+b; }
    else if(k==='addsub'){ var c=ri(20,80), d=ri(2,9); L=c+d; Rv=c-d; ls=c+' + '+d; rs=c+' − '+d; if(rnd()<0.5){ var tt=L; L=Rv; Rv=tt; var ts=ls; ls=rs; rs=ts; } }
    else { var ds=sample([1,2,3,4,5,6,7,8,9],2), z=pick([0,ri(1,9)]); L=100*ds[0]+10*z+ds[1]; Rv=100*ds[1]+10*z+ds[0]; ls=String(L); rs=String(Rv); }
    return Q('比一比，在□中要填入「＞」、「＝」還是「＜」？\n'+ls+' □ '+rs, {choices:cmpChoices(L,Rv)});
  }
  function g2r11_which(){
    var a=sample([1,2,3,4,5,6,7,8,9],2).sort(function(x,y){ return y-x; }), b=sample([1,2,3,4,5,6,7,8,9],2).sort(function(x,y){ return y-x; }), z=ri(0,9);
    var big1=100*a[0]+a[1], small1=100*a[1]+a[0];          // 例：904 與 409
    var big2=100*b[0]+10*b[1], small2=100*b[1]+10*b[0];    // 例：650 與 560
    var same=100*ri(1,9)+10*z+ri(0,9);
    var good=pick([[big1+' ＞ '+small1],[small2+' ＜ '+big2]])[0];
    return Q('下面哪一個是對的？', {choices:mc(good,[
      [small1+' ＞ '+big1,'比較三位數時，沒有先從百位比起'],[big2+' ＜ '+small2,'比較三位數時，沒有先從百位比起'],[same+' ＞ '+same,'一樣大的數要用「＝」，不能用「＞」']])});
  }

  /* ---------- NC-2-4-1 估算 ---------- */
  function g241_price(){
    var A=ri(1,4), B=ri(1,4), down=rnd()<0.4, a=100*A+pick([98,99]), b=down?100*B+pick([1,2]):100*B+pick([98,99]);
    var ea=A+1, eb=down?B:B+1, est=100*(ea+eb);
    var items=pick([['裙子','外套'],['上衣','短褲'],['書包','水壺']]);
    return Q('買一件 '+a+' 元的'+items[0]+'和一件 '+b+' 元的'+items[1]+'，合起來最接近幾元？', {choices:mc(est+'元',[
      [(est-100)+'元','估算時只看百位數字，沒有想到'+a+'很接近'+(100*ea)],[(est+100)+'元','估算時取整百的方向錯了'],[(est+200)+'元','估算時取整百的方向錯了']])});
  }
  function g241_diff(){
    var A=ri(4,8), B=ri(1,A-2), a=100*A-pick([1,2]), b=100*B+pick([1,2]), est=100*(A-B);
    return Q('下面哪個數最接近「'+a+' − '+b+'」的差？', {choices:mc(est,[
      [est-100,'估算時只看百位數字，沒有取最接近的整百'],[est+100,'估算時取整百的方向錯了'],[est+200,'估算時取整百的方向錯了']])});
  }

  /* ---------- NC-2-5-1 錢幣 ---------- */
  function moneyOpt(T){ return {t:T+'元的錢', h:svgMoney(decompose(T))}; }
  function g251_pick(){
    var T=100*ri(1,3)+10*ri(1,8)+pick([0,5,ri(1,4)]);
    return Q('下面哪一個選項，合起來是 '+T+' 元？', {one:true, choices:mc(moneyOpt(T),[
      [moneyOpt(T+10),'數錢時面額相加錯誤'],[moneyOpt(T-10),'數錢時面額相加錯誤'],[moneyOpt(T+50),'數錢時面額相加錯誤']])});
  }
  function g251_change(){
    var p=100*ri(1,3)+10*ri(1,8)+pick([0,ri(1,9)]), c=500-p;
    return Q('一本書 '+p+' 元，付了 500 元，要找回多少元？', {choices:mc(c+'元',[
      [bigMinusSmall(500,p)+'元','退位減法算錯（用大數減小數）'],[(500+p)+'元','誤用加法'],[(c+100)+'元','退位後百位沒有減1']])});
  }
  function g251_exchange(){
    if(rnd()<0.5) return Q('拿 10 張 100 元，全部可以換成幾張 500 元？', {choices:mc('2張',[
      ['10張','換錢時沒有先算出一共多少元'],['5張','把500元看成5元來算'],['1張','把10張100元當成500元']])});
    return Q('1000 元可以換成幾張 100 元？', {choices:mc('10張',[['100張','把1000元看成1000個1元'],['1張','不知道1000元等於10個100元'],['5張','換錢的方法還不熟']])});
  }

  /* ---------- NC-2-2-1 二位數加減直式 ---------- */
  function g221_sub(){
    var t1=ri(5,9), t2=ri(1,t1-1), o1=ri(0,7), o2=ri(o1+1,9), a=10*t1+o1, b=10*t2+o2, c=a-b;
    return Q('寫成直式算算看：'+a+' − '+b+' = （　）', {vis:vert(a,b,'−'), num:c, errs:mk([

    'NC-2-8-1':{name:'加與減兩步驟問題（不含併式）', tip:'用「先算、再算」兩個算式記錄；分段布題，先問第一步的結果，再接著問第二步。可搭配學扶教材 NC-2-8-1。'},
    'NC-2-6-1':{name:'理解乘法的意義，並用乘法算式記錄連加活動的結果', tip:'用「每份一樣多」的實物連加，再寫成乘法算式（3+3+3+3 寫成 3×4）；說出「幾的幾倍」。可搭配學扶教材 NC-2-6-1。'},
    'NC-2-6-2':{name:'用乘法解決生活中的問題', tip:'先找出「每一份是多少」和「有幾份」，再列乘法算式；避免把兩個數直接相加。可搭配學扶教材 NC-2-6-2。'},
    'NC-2-7-1':{name:'理解十十乘法', tip:'用「多一個、少一個」推出不熟的乘法（7×9 比 7×10 少一個 7）；每天短時間練習九九乘法。可搭配學扶教材 NC-2-7-1。'},
    'RC-2-3-1':{name:'認識乘法交換律', tip:'用排成長方形的點子圖，橫著看是 4×12、直著看是 12×4，總數一樣。可搭配學扶教材 RC-2-3-1。'},
    'NC-2-8-2':{name:'先乘後加（減）兩步驟問題（不含併式）', hot:true, tip:'孩子常算完「5×9=45」就以為是答案。用分段布題：先問「一共存了多少元」，再問「加上原來的錢共有多少元」，最後回到原題，要求用兩個算式記下「先算、再算」。可搭配學扶教材 NC-2-8-2。'},
    'NC-2-11-1':{name:'認識用不同個別單位測量同一長度時，其數值不同，並能說明原因', tip:'讓孩子用迴紋針和鉛筆量同一張桌子，比較數量；說出「用來量的東西越長，量出來的數越小」。可搭配學扶教材 NC-2-11-1。'},
    'NC-2-11-2':{name:'認識長度單位「公分」、「公尺」及其關係，並作實測、估測與計算；公分、公尺單位間的化聚', hot:true, tip:'多做以 1 公分、1 公尺為單位的實測；用米尺看出 1 公尺＝100 公分，練習「2 公尺 2 公分＝202 公分」，並和 22、220 比較。可搭配學扶教材 NC-2-11-2。'},
    'SC-2-3-1':{name:'用直尺測量給定線段的長度及兩點的距離', hot:true, tip:'先認識相鄰兩個大刻度之間是 1 公分；用沒有 0 刻度的斷尺，從物品的一端開始「數有幾個 1 公分」，不急著要求用減法。可搭配學扶教材 SC-2-3-1。'},
    'NC-2-12-1':{name:'認識容量並進行容量的直接、間接與個別單位比較', hot:true, tip:'先讓孩子把容器「裝滿」，理解容量是裝滿時的量；用同樣的杯子倒水，杯數越多容量越大。可搭配學扶教材 NC-2-12-1。'},
    'NC-2-12-2':{name:'認識重量並進行重量的直接、間接與個別單位比較', tip:'實際用天平操作，說出「低下去的那邊比較重」；用積木當個別單位，比較並算出重幾個。可搭配學扶教材 NC-2-12-2。'},
    'SC-2-4-2':{name:'認識周長，並實測周長', hot:true, tip:'用手指或毛線沿著圖形的邊走一圈，理解周長是一圈的長度；長方形要把 4 個邊都加起來，不要只加標出的兩個邊；和「格子數（面積）」做區分。可搭配學扶教材 SC-2-4-2。'},
    'NC-2-13-1':{name:'認識鐘面上的刻度結構，並報讀鐘面上的時刻是幾時幾分', hot:true, tip:'先分別報讀分針（結合 5 個一數和 1 個一數）和時針，再一起讀；多撥教具鐘，讓孩子看到 8 時 1 分到 8 時 59 分時針都還沒到 9，避免把 8 時 55 分讀成 9 時 55 分。可搭配學扶教材 NC-2-13-1、2。'},
    'NC-2-13-2':{name:'認識整點至整點間經過多少時間', hot:true, tip:'只用順時針撥鐘；從開始時刻起，每撥一圈伸出一根手指，數完再看伸出幾根手指，就是經過幾小時。可搭配學扶教材 NC-2-13-1、2。'},
    'SC-2-1-1':{name:'認識簡單平面圖形的角、頂點與邊', tip:'在圖形上用不同顏色描出邊、點出頂點、畫出角，數的時候做記號避免重複。可搭配學扶教材 SC-2-1-1。'},
    'SC-2-1-3':{name:'認識平面圖形的內、外部與其周界', tip:'用跳格子、套圈圈等活動體驗「在裡面、在外面、剛好在線上」；數內部的東西時不要把外部的也算進去。可搭配學扶教材 SC-2-1-3。'}
